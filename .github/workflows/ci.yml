name: ci

on:
  push:
    branches: [main]
  pull_request:

# Clang on both platforms: it is the compiler the project is developed and benchmarked
# with, and it is preinstalled on the Ubuntu runners.
env:
  CC: clang
  CXX: clang++

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is x86-64 and exercises the SSE2 kernels; macos-latest is
        # arm64 and exercises NEON.
        os: [ubuntu-latest, macos-latest]
        preset: [dev, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      # Recent Ubuntu kernels randomize mappings into ranges the sanitizers reserve.
      - name: Make address randomization compatible with sanitizers
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  scalar:
    name: forced scalar kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/scalar -DANNVIL_FORCE_SCALAR=ON -DANNVIL_BUILD_TOOLS=OFF
      - run: cmake --build build/scalar -j 4
      - run: ctest --test-dir build/scalar --output-on-failure

  python:
    name: python bindings
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-group bench --python 3.12
      - run: uv run --no-group bench pytest -q
      - run: uv run --no-group bench ruff check .

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' \
            | xargs uvx --from clang-format==19.1.7 clang-format --dry-run --Werror
